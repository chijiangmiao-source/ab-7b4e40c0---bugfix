server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 健康响应：Compose 健康检查与 verify 冒烟共用
    location = /healthz {
        default_type text/plain;
        return 200 'ok\n';
    }

    # ES 模块：显式声明 JS MIME，避免依赖 mime.types 版本差异
    location ~* \.mjs$ {
        default_type "text/javascript; charset=utf-8";
        add_header Cache-Control "public, max-age=60";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
